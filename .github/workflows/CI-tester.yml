name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    if: github.head_ref == 'test'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
