name: Ci-feature_to_test

on:
  pull_request:
    branches: [ test ]

jobs:
  test:
    if: github.head_ref == 'feature/test-ci'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature/test-ci
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
